  <style>
    body { font-family: 'Fredoka', sans-serif; overflow:hidden; }
    .font-fun { font-family: 'Baloo 2', cursive; }

    .rainbow-bg {
      background: linear-gradient(-45deg,#38bdf8,#a78bfa,#f472b6,#facc15,#34d399);
      background-size: 400% 400%;
      animation: gradientMove 12s ease infinite;
    }
    @keyframes gradientMove {
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }

    .float {
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-15px)}
    }

    .confetti-piece{
      position:absolute;
      width:10px;
      height:14px;
      top:-20px;
      animation:confettiFall 3s linear forwards;
    }
    @keyframes confettiFall{
      to{transform:translateY(110vh) rotate(720deg);opacity:0}
    }

    .pulse-glow {
      animation: pulseGlow 2s infinite;
    }
    @keyframes pulseGlow {
      0%{box-shadow:0 0 0 0 rgba(255,255,255,0.6)}
      70%{box-shadow:0 0 0 20px rgba(255,255,255,0)}
      100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}
    }
  </style>

</head>

<script>
  // Confetti burst on load
  function launchConfetti(){
    for(let i=0;i<100;i++){
      const conf=document.createElement('div');
      conf.classList.add('confetti-piece');
      conf.style.left=Math.random()*100+'vw';
      conf.style.background=['#f472b6','#facc15','#34d399','#38bdf8','#a78bfa','#ffffff'][Math.floor(Math.random()*6)];
      conf.style.animationDuration=(Math.random()*2+2)+'s';
      document.body.appendChild(conf);
      setTimeout(()=>conf.remove(),4000);
    }
  }
  window.onload=launchConfetti;
</script>
